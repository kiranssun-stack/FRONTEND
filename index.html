<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digit Recognition</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #2a2a3a;
      --accent: #c8f04a;
      --accent2: #4af0c8;
      --text: #e8e8f0;
      --muted: #6a6a8a;
      --danger: #f04a6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,240,74,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,240,74,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      width: 100%;
      max-width: 800px;
      padding: 48px 24px 0;
      position: relative;
      z-index: 1;
    }

    .tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag::before {
      content: '';
      width: 20px; height: 1px;
      background: var(--accent);
    }

    h1 {
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      font-family: 'Space Mono', monospace;
      margin-bottom: 48px;
    }

    /* API URL config */
    .config-bar {
      width: 100%;
      max-width: 800px;
      padding: 0 24px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .config-bar label {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    .config-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      color: var(--accent2);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .config-bar input:focus { border-color: var(--accent2); }
    .config-bar input::placeholder { color: var(--muted); }

    /* Main card */
    .main {
      width: 100%;
      max-width: 800px;
      padding: 0 24px 48px;
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 600px) {
      .main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .card-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Canvas draw area */
    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: crosshair;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .canvas-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* Upload area */
    .upload-area {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .upload-area:hover, .upload-area.drag-over {
      border-color: var(--accent);
      background: rgba(200,240,74,0.04);
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 10px;
      display: block;
    }

    .upload-area p {
      font-size: 13px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .upload-area strong {
      color: var(--accent);
    }

    #file-input { display: none; }

    #preview-img {
      width: 100%;
      border-radius: 8px;
      display: none;
      border: 1px solid var(--border);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      transition: all 0.15s;
      font-size: 13px;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0f;
      padding: 12px 24px;
      flex: 1;
      letter-spacing: 1px;
    }
    .btn-primary:hover { background: #d8ff5a; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding: 12px 16px;
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
      border-right: 1px solid var(--border);
    }
    .tab:last-child { border-right: none; }
    .tab.active {
      background: rgba(200,240,74,0.1);
      color: var(--accent);
    }

    /* Result card */
    .result-card {
      grid-column: 1 / -1;
      display: none;
    }

    .result-card.visible { display: block; }

    .result-inner {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .result-digit {
      font-size: 96px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      font-family: 'Space Mono', monospace;
      min-width: 100px;
      text-align: center;
      animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .result-meta { flex: 1; }

    .result-label {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .confidence-bar-wrap {
      background: var(--border);
      border-radius: 4px;
      height: 6px;
      width: 100%;
      overflow: hidden;
      margin-top: 8px;
    }

    .confidence-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      width: 0%;
    }

    .confidence-pct {
      font-size: 28px;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: var(--text);
      margin-top: 4px;
    }

    .confidence-pct span {
      font-size: 14px;
      color: var(--muted);
    }

    /* Error state */
    .error-msg {
      display: none;
      background: rgba(240,74,106,0.1);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 16px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--danger);
      margin-top: 16px;
      grid-column: 1 / -1;
    }
    .error-msg.visible { display: block; }

    /* Loader */
    .loader {
      display: none;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader.visible { display: block; }

    .processing {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 24px;
    }
    .processing.visible { display: block; }
    .processing p {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<header>
  <div class="tag">ML · Neural Network</div>
  <h1>Handwriting<br><span>Recognizer</span></h1>
  <p class="subtitle">// draw or upload a digit → get instant prediction</p>
</header>

<div class="config-bar">
  <label>API Endpoint</label>
  <input type="text" id="api-url" placeholder="https://backend-handwriting-recognition-1.onrender.com" />
</div>

<div class="main">

  <!-- Input Card -->
  <div class="card">
    <div class="card-label">Input</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('draw')">✏ Draw</button>
      <button class="tab" onclick="switchTab('upload')">⬆ Upload</button>
    </div>

    <!-- Draw Tab -->
    <div id="tab-draw">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="draw-canvas" width="280" height="280"></canvas>
        <div class="canvas-hint" id="canvas-hint">Draw a digit here</div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="predictDraw()">Predict</button>
        <button class="btn-ghost" onclick="clearCanvas()">Clear</button>
      </div>
    </div>

    <!-- Upload Tab -->
    <div id="tab-upload" style="display:none">
      <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropFile(event)">
        <span class="upload-icon">🖼</span>
        <p><strong>Click to upload</strong> or drag & drop</p>
        <p style="margin-top:6px;font-size:11px;">PNG, JPG — digit image</p>
      </div>
      <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)" />
      <img id="preview-img" alt="preview" />
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn-primary" id="upload-predict-btn" onclick="predictUpload()" disabled>Predict</button>
        <button class="btn-ghost" onclick="clearUpload()">Clear</button>
      </div>
    </div>
  </div>

  <!-- Result Card -->
  <div class="card">
    <div class="card-label">Result</div>

    <div class="processing" id="processing">
      <div class="loader visible"></div>
      <p>Analyzing...</p>
    </div>

    <div id="result-display" style="display:none">
      <div class="result-inner">
        <div class="result-digit" id="result-digit">?</div>
        <div class="result-meta">
          <div class="result-label">Predicted Digit</div>
          <div class="confidence-pct" id="conf-pct">—<span> %</span></div>
          <div class="result-label" style="margin-top:12px;">Confidence</div>
          <div class="confidence-bar-wrap">
            <div class="confidence-bar" id="conf-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="idle-state" style="text-align:center; padding: 32px 0;">
      <div style="font-size:48px; margin-bottom:12px; opacity:0.3;">🔢</div>
      <p style="font-family:'Space Mono',monospace; font-size:12px; color:var(--muted);">Awaiting input…</p>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg"></div>

</div>

<script>
  // ── Canvas Drawing ──────────────────────────────────────────
  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let hasDrawn = false;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 280, 280);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 18;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 280 / rect.width;
    const scaleY = 280 / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
  }

  canvas.addEventListener('mousedown', e => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('mousemove', e => { if (!drawing) return; hasDrawn = true; document.getElementById('canvas-hint').style.opacity = '0'; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseleave', () => drawing = false);

  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!drawing) return; hasDrawn = true; document.getElementById('canvas-hint').style.opacity = '0'; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x, p.y); }, { passive: false });
  canvas.addEventListener('touchend', () => drawing = false);

  function clearCanvas() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 280, 280);
    hasDrawn = false;
    document.getElementById('canvas-hint').style.opacity = '1';
    resetResult();
  }

  // ── Tab Switch ──────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('tab-draw').style.display = tab === 'draw' ? 'block' : 'none';
    document.getElementById('tab-upload').style.display = tab === 'upload' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'draw')));
    resetResult();
  }

  // ── File Upload ─────────────────────────────────────────────
  let uploadedFile = null;

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    uploadedFile = file;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.getElementById('preview-img');
      img.src = ev.target.result;
      img.style.display = 'block';
      document.getElementById('upload-area').style.display = 'none';
      document.getElementById('upload-predict-btn').disabled = false;
    };
    reader.readAsDataURL(file);
  }

  function clearUpload() {
    uploadedFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('upload-area').style.display = 'block';
    document.getElementById('upload-predict-btn').disabled = true;
    resetResult();
  }

  function dragOver(e) { e.preventDefault(); document.getElementById('upload-area').classList.add('drag-over'); }
  function dragLeave() { document.getElementById('upload-area').classList.remove('drag-over'); }
  function dropFile(e) {
    e.preventDefault();
    dragLeave();
    const file = e.dataTransfer.files[0];
    if (file) { document.getElementById('file-input').files = e.dataTransfer.files; handleFile({ target: { files: [file] } }); }
  }

  // ── Prediction ──────────────────────────────────────────────
  function getApiUrl() {
    return document.getElementById('api-url').value.trim();
  }

  function showProcessing() {
    document.getElementById('processing').classList.add('visible');
    document.getElementById('result-display').style.display = 'none';
    document.getElementById('idle-state').style.display = 'none';
    document.getElementById('error-msg').classList.remove('visible');
  }

  function showResult(prediction, confidence) {
    document.getElementById('processing').classList.remove('visible');
    document.getElementById('result-display').style.display = 'block';
    document.getElementById('idle-state').style.display = 'none';

    document.getElementById('result-digit').textContent = prediction;
    const pct = Math.round(confidence * 100);
    document.getElementById('conf-pct').innerHTML = `${pct}<span> %</span>`;
    setTimeout(() => { document.getElementById('conf-bar').style.width = pct + '%'; }, 50);
  }

  function showError(msg) {
    document.getElementById('processing').classList.remove('visible');
    document.getElementById('idle-state').style.display = 'block';
    const el = document.getElementById('error-msg');
    el.textContent = '⚠ ' + msg;
    el.classList.add('visible');
  }

  function resetResult() {
    document.getElementById('processing').classList.remove('visible');
    document.getElementById('result-display').style.display = 'none';
    document.getElementById('idle-state').style.display = 'block';
    document.getElementById('error-msg').classList.remove('visible');
    document.getElementById('conf-bar').style.width = '0%';
  }

  // Canvas → 784 pixel array
  function canvasToPixels() {
    const offscreen = document.createElement('canvas');
    offscreen.width = 28; offscreen.height = 28;
    const octx = offscreen.getContext('2d');
    octx.drawImage(canvas, 0, 0, 28, 28);
    const data = octx.getImageData(0, 0, 28, 28).data;
    const pixels = [];
    for (let i = 0; i < data.length; i += 4) {
      pixels.push(data[i] / 255.0); // grayscale via red channel
    }
    return pixels;
  }

  // Image file → 784 pixel array
  function imageToPixels(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const offscreen = document.createElement('canvas');
        offscreen.width = 28; offscreen.height = 28;
        const octx = offscreen.getContext('2d');
        octx.fillStyle = '#000';
        octx.fillRect(0, 0, 28, 28);
        octx.drawImage(img, 0, 0, 28, 28);
        const data = octx.getImageData(0, 0, 28, 28).data;
        const pixels = [];
        for (let i = 0; i < data.length; i += 4) {
          const gray = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114) / 255;
          pixels.push(gray);
        }
        resolve(pixels);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function callAPI(pixels) {
    const url = getApiUrl();
    if (!url || url === 'https://backend-handwriting-recognition-1.onrender.com/predict') {
      showError('Please enter your Render API URL above.');
      return;
    }
    showProcessing();
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_data: pixels })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      showResult(data.prediction, data.confidence);
    } catch (e) {
      showError(e.message || 'Failed to reach API. Check the URL and CORS settings.');
    }
  }

  async function predictDraw() {
    if (!hasDrawn) { showError('Please draw a digit first.'); return; }
    const pixels = canvasToPixels();
    await callAPI(pixels);
  }

  async function predictUpload() {
    if (!uploadedFile) { showError('Please upload an image first.'); return; }
    try {
      const pixels = await imageToPixels(uploadedFile);
      await callAPI(pixels);
    } catch {
      showError('Could not process the image.');
    }
  }
</script>
</body>
</html>
